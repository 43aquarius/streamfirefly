name: 功能建议 / Feature request
description: 建议新功能或改进现有功能
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        English requests are welcome.

  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前确认
      options:
        - label: 已搜索[已有 issue](https://github.com/rumoii/streamfirefly/issues?q=is%3Aissue)，包括已关闭的，没有重复
          required: true
        - label: 了解流萤不绕过 DRM，也不接受规避平台限制的需求
          required: true

  - type: dropdown
    id: ai_usage
    attributes:
      label: AI 使用说明 / AI disclosure
      description: 写这个 issue 时有没有借助 AI。用了也没关系，如实说明即可，见 [CONTRIBUTING.md](https://github.com/rumoii/streamfirefly/blob/main/CONTRIBUTING.md#使用-ai-的说明)。
      options:
        - 没有使用 AI
        - 只用 AI 整理或翻译文字
        - 建议内容主要由 AI 生成或分析
    validations:
      required: true

  - type: input
    id: ai_model
    attributes:
      label: 使用的 AI 工具和模型
      description: 用了 AI 就必须填，写具体型号和版本，不要只写“AI”。
      placeholder: chatgpt-6.1-sol

  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题
      description: 描述你遇到的场景，以及现在哪里不方便。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 设想的做法
      description: 希望流萤怎样处理。

  - type: textarea
    id: workaround
    attributes:
      label: 现在的替代办法
      description: 目前是怎么绕过这个问题的，或者其他工具是怎么做的。

  - type: textarea
    id: examples
    attributes:
      label: 相关网站或示例
